services:
  vulnerable:
    build: ./vulnerable
    image: brine-vulnerable
    container_name: brine-vulnerable
    ports:
      - "5000:5000"
    environment:
      FLAG: "FLAG{example_placeholder_change_me}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3

  fixed:
    build: ./fixed
    image: brine-fixed
    container_name: brine-fixed
    ports:
      - "5001:5000"
    environment:
      SECRET_KEY: "change-me-in-production"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
